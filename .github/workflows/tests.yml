name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and HTTP integration tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Compile application modules
        run: PYTHONPYCACHEPREFIX=/tmp/vnl_pycache python3 -m compileall -q app.py vuln_notes
