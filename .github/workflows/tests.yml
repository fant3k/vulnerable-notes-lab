name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -B -m unittest discover -s tests
      - run: PYTHONPYCACHEPREFIX=/tmp/vnl_pycache python3 -m compileall vuln_notes
